name: One-time upstream migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-upstream.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/Vexushi1/mathmodel-skill.git /tmp/mathmodel-skill-source

      - name: Copy upstream content
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/mathmodel-skill-source/ ./
          rm -f .github/workflows/migrate-upstream.yml

      - name: Commit migrated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Import Vexushi1/mathmodel-skill"
          git push origin HEAD:main
