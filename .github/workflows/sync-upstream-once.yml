name: One-time upstream sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream repository
        run: |
          git clone --depth 1 https://github.com/Vexushi1/mathmodel-skill.git /tmp/mathmodel-skill-source

      - name: Mirror upstream content
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/mathmodel-skill-source/ ./
          rm -f .github/workflows/sync-upstream-once.yml

      - name: Commit synchronized repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches upstream."
            exit 0
          fi
          git commit -m "Sync Vexushi1/mathmodel-skill main"
          git push origin HEAD:main
