name: Final one-time upstream mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-upstream-mirror-once.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/Vexushi1/mathmodel-skill.git /tmp/upstream
      - name: Mirror all non-workflow content exactly
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/upstream/ ./
      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync upstream metadata and repository content"
          git push origin HEAD:main
